name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more specific you can be, the faster we can fix it.
  - type: input
    id: version
    attributes:
      label: Thoughtline version
      description: Output of `thoughtline --version`
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      description: Claude Code, Cursor, Zed, raw stdio, etc.
      placeholder: "Claude Code 2.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal, ordered steps. If it involves a tool call, paste the JSON-RPC request.
      placeholder: |
        1. Run `thoughtline mcp`
        2. Send `tl_save` with …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Stderr from `thoughtline mcp`, plus any client-side error.
      render: shell
